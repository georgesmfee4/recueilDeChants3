# Contrôles automatiques et publication des mises à jour.
#
# UN SEUL FICHIER pour les deux, et ce n'est pas un hasard : la publication
# doit dépendre des contrôles. Avec `needs: verifier`, GitHub refuse de lancer
# la publication tant que les contrôles ne sont pas VERTS. C'est la garantie
# la plus importante du projet — sans elle, un `git push` malheureux enverrait
# des paroles corrompues sur tous les téléphones déjà installés.
#
# Deux workflows séparés ne pourraient pas offrir cette garantie : `needs` ne
# franchit pas les frontières d'un fichier, et chacun referait les mêmes
# contrôles de son côté, pour rien.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  verifier:
    name: Types, conventions et données
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` installe EXACTEMENT les versions du package-lock.json, sans
      # jamais les mettre à jour. C'est ce qui garantit que la CI teste bien le
      # même code que celui qui tourne sur votre machine.
      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npx tsc --noEmit

      - name: Vérifier les conventions
        run: npx eslint .

      # Les 33 tests, dont les 9 invariants du recueil : 302 cantiques,
      # 85 chœurs, 5771 lignes, aucun numéro manquant…
      - name: Lancer les tests
        run: npx jest --ci

      # Dernière vérification : le paquet JavaScript se construit-il vraiment ?
      # Un projet peut passer le typage et les tests et refuser de s'assembler.
      - name: Construire le paquet
        run: npx expo export --platform android --output-dir /tmp/verification-bundle

  publier:
    name: Publier la mise à jour
    needs: verifier
    runs-on: ubuntu-latest
    # Jamais sur une proposition de modification : on ne publie que ce qui est
    # réellement entré dans `main` ou `develop`.
    if: github.event_name == 'push'

    # Le secret est copié dans une variable d'environnement : le contexte
    # `secrets` n'est pas lisible dans les conditions `if` des étapes, alors
    # que `env` l'est. C'est le moyen standard de tester la présence d'un secret.
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      # Si le jeton manque, on prévient clairement au lieu d'échouer sur une
      # erreur obscure — et on saute tout le reste.
      - name: Vérifier la présence du jeton Expo
        if: env.EXPO_TOKEN == ''
        run: |
          echo "::warning::EXPO_TOKEN est absent : la mise à jour OTA n'a pas été publiée."
          echo "Pour l'ajouter : expo.dev → Account settings → Access tokens,"
          echo "puis GitHub → Settings → Secrets and variables → Actions."

      - uses: actions/checkout@v4
        if: env.EXPO_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.EXPO_TOKEN != ''
        with:
          node-version: 20
          cache: npm

      - name: Installer EAS
        if: env.EXPO_TOKEN != ''
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Installer les dépendances
        if: env.EXPO_TOKEN != ''
        run: npm ci

      # `main` = ce que voient les fidèles. On y publie le canal `production`.
      - name: Publier sur production
        if: env.EXPO_TOKEN != '' && github.ref == 'refs/heads/main'
        run: eas update --branch production --message "${{ github.event.head_commit.message }}" --non-interactive

      # `develop` = le canal interne, pour que l'auteur essaie avant diffusion.
      - name: Publier sur preview
        if: env.EXPO_TOKEN != '' && github.ref == 'refs/heads/develop'
        run: eas update --branch preview --message "${{ github.event.head_commit.message }}" --non-interactive
