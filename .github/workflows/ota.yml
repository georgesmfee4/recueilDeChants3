# Publication des mises à jour par les airs (OTA).
#
# À chaque envoi sur `main`, la nouvelle version du JavaScript et des données
# du recueil est publiée. Les téléphones déjà installés la reçoivent au
# lancement suivant — sans repasser par le Play Store ni l'App Store.
#
# GARDE-FOU : `needs: verifier` fait attendre ce travail que les contrôles
# soient VERTS. Si un type est faux, une convention violée ou un invariant du
# recueil cassé, rien n'est publié. C'est la règle la plus importante du
# fichier.
#
# PRÉREQUIS : le secret `EXPO_TOKEN` doit exister dans le dépôt
# (Settings → Secrets and variables → Actions → New repository secret).
# On l'obtient sur expo.dev → Account settings → Access tokens.
# Tant qu'il est absent, la publication est IGNORÉE avec un avertissement
# lisible, plutôt que de faire échouer le workflow avec une erreur obscure.
name: OTA

on:
  push:
    branches: [main, develop]

jobs:
  # On rejoue les contrôles ici plutôt que de faire confiance : un envoi direct
  # sur `main` pourrait sinon contourner la CI.
  verifier:
    name: Contrôles avant publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx jest --ci

  publier:
    name: Publier la mise à jour
    needs: verifier
    runs-on: ubuntu-latest

    # Le secret est copié dans une variable d'environnement : le contexte
    # `secrets` n'est pas lisible dans les conditions `if` des étapes, alors
    # que `env` l'est. C'est le moyen standard de tester la présence d'un secret.
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Vérifier la présence du jeton Expo
        if: env.EXPO_TOKEN == ''
        run: |
          echo "::warning::EXPO_TOKEN est absent : la mise à jour OTA n'a pas été publiée."
          echo "Pour l'ajouter : expo.dev → Account settings → Access tokens,"
          echo "puis GitHub → Settings → Secrets and variables → Actions."

      - uses: actions/checkout@v4
        if: env.EXPO_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.EXPO_TOKEN != ''
        with:
          node-version: 20
          cache: npm

      - name: Installer EAS
        if: env.EXPO_TOKEN != ''
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Installer les dépendances
        if: env.EXPO_TOKEN != ''
        run: npm ci

      # `main` = ce que voient les fidèles. On y publie le canal `production`.
      - name: Publier sur production
        if: env.EXPO_TOKEN != '' && github.ref == 'refs/heads/main'
        run: eas update --branch production --message "${{ github.event.head_commit.message }}" --non-interactive

      # `develop` = le canal interne, pour que l'auteur essaie avant diffusion.
      - name: Publier sur preview
        if: env.EXPO_TOKEN != '' && github.ref == 'refs/heads/develop'
        run: eas update --branch preview --message "${{ github.event.head_commit.message }}" --non-interactive
